# Provider/judge configs consumed by tests/nl2sparql/eval/runner.py::run(config_name).
#
# Each entry under `configs:` selects an LLMClient (arango_sparql/nl2sparql/client.py)
# via `provider.type`, a judge strategy, and the pipeline's `max_repairs` bound.
#
# `provider.type` values map 1:1 onto the runner's client factory branches:
#   scripted          -> ScriptedLLMClient (no network; the CI default)
#   openai|openrouter -> OpenAICompatibleClient
#   anthropic         -> AnthropicClient
#
# Real-provider credentials are NEVER stored here — they are read from the
# NL2SPARQL_* environment variables (see arango_sparql/nl2sparql/client.py) only
# when a non-scripted config is actually run. This file is checked into VCS as
# trusted repo data; it holds no credentials. The optional `few_shot:` block
# (added Phase 7 07-04) is likewise config-only data (mode + k) — it never
# carries a bank path override or any credential; the bank file itself lives
# at arango_sparql/nl2sparql/fewshot_bank.yml (07-02), trusted repo data.
#
# The optional `grounding:` block (added Phase 07.3-05) is the entity/instance
# grounding seam's config-only data (k + label_predicates) — runner.py builds
# a LabelIndex from the corpus's `data_path:` instance graph ONCE per run and
# threads it into every case's NlPipeline. Absent `grounding:` == today's
# ungrounded behavior. `label_predicates:` is declarative, reviewable config
# — any dataset-specific predicate (e.g. CK25's product-vocab name predicate)
# lives ONLY here, never hardcoded in runner.py.

configs:
  # The CI default: no network, deterministic, gates baseline.json.
  scripted:
    provider:
      type: scripted
    judge: canonical
    max_repairs: 2

  # Documents the real-provider sweep shape. Not run in CI — nightly/manual only.
  openai-gpt4o-mini:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: canonical
    max_repairs: 2

  # --------------------------------------------------------------------
  # Phase 07.1-06: per-set QALD-9-plus / CK25 configs via the additive
  # `corpus:` key (07.1-01 / RESEARCH Pattern 1). Two jobs, two sets
  # (D-02/D-03): QALD is the powered gate, CK25 is the reported (un-gated)
  # corporate-domain anchor — each gets its OWN scripted + live config and
  # its OWN baseline.json entry, never blended into the hand-authored
  # `scripted` corpus above (Pitfall 3).
  # --------------------------------------------------------------------

  # QALD-9-plus — no network, deterministic; gates its OWN baseline.json entry.
  scripted-qald9plus:
    provider:
      type: scripted
    judge: canonical
    max_repairs: 2
    corpus: vendored/qald9plus/corpus.yml

  # CK25 — no network, deterministic; gates its OWN baseline.json entry.
  # 07.2: flipped to judge: execution in place (D-06) — CK25's corpus-level
  # data_path vendors a real instance graph, so answer-set execution grading
  # applies here (unlike the hand-authored `scripted` corpus above).
  scripted-ck25:
    provider:
      type: scripted
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml

  # Live QALD-9-plus sweep — documents the real-provider shape. Not run in
  # CI — gated behind RUN_EVAL=1 + NL2SPARQL_API_KEY, human-run (README §3).
  openai-gpt4o-mini-qald9plus:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: canonical
    max_repairs: 2
    corpus: vendored/qald9plus/corpus.yml

  # Live CK25 sweep — same discipline as above.
  # 07.2: flipped to judge: execution in place (D-06) — same rationale as
  # scripted-ck25 above.
  openai-gpt4o-mini-ck25:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml

  # --------------------------------------------------------------------
  # Phase 07.3-05: entity/instance grounding (seam 6) additive `grounding:`
  # block on top of the CK25 execution-judged configs above. `pv:name`
  # appears ONLY in this `label_predicates:` list (declarative, reviewable
  # config) — never hardcoded in runner.py (grep gate == 0). scripted-
  # ck25-grounded is a PLUMBING gate only (config -> build_label_index ->
  # seam -> prompt -> judge does not crash) — it is NOT accuracy evidence
  # (RESEARCH Pitfall 5); scripted stays the CI default regardless.
  # --------------------------------------------------------------------

  # CK25 grounded — no network, deterministic; plumbing gate (Pitfall 5).
  scripted-ck25-grounded:
    provider:
      type: scripted
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    grounding:
      k: 20
      label_predicates: ["rdfs:label", "pv:name"]

  # Live CK25 grounded sweep — same discipline as openai-gpt4o-mini-ck25
  # above. Not run in CI — gated behind RUN_EVAL=1 + NL2SPARQL_API_KEY,
  # human-run.
  #
  # Plan 07.3-06 Task 1 (RESEARCH Open Question 1) — temperature provenance:
  # this config has no `temperature:` key (none is read anywhere in this
  # file); runner.py::_client_for() constructs OpenAICompatibleClient(
  # provider=ptype, model=provider.get("model")) with no explicit
  # `temperature=` argument, so it falls through to
  # OpenAICompatibleClient.__init__'s hardcoded default `temperature: float
  # = 0.1` (arango_sparql/nl2sparql/client.py). gpt-4o-mini is not a
  # _is_reasoning_model() match, so 0.1 IS sent explicitly on every call.
  # This is the SAME 0.1 already recorded in baseline.json's committed
  # openai-gpt4o-mini-ck25 entry -- so a live re-run of that config this
  # session (the fresh zero arm) and this grounded config both run at 0.1,
  # not the spike's temperature=0 (grounding_spike.py hardcoded 0 in its raw
  # HTTP call). A non-reproduction of the spike's exact 6/49->12/49 numbers
  # is therefore attributable to this temperature delta, not to grounding
  # failing -- record `"temperature": 0.1` in the baseline.json fold-in
  # (Task 3), not the spike's 0.
  openai-gpt4o-mini-ck25-grounded:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    grounding:
      k: 20
      label_predicates: ["rdfs:label", "pv:name"]

  # --------------------------------------------------------------------
  # Phase 7 07-04: 3-arm (zero/dense/bm25) x 3-model (gpt-4o-mini anchor,
  # gpt-5-mini, gpt-5) matrix. All additive; `few_shot` absent == today's
  # zero-shot behavior. Not run in CI — gated behind RUN_EVAL=1 +
  # NL2SPARQL_API_KEY per the Task 4 human-run sweep (README §7).
  # --------------------------------------------------------------------

  # --------------------------------------------------------------------
  # Phase 07.4: predicate/schema-convention grounding (seam 7) additive
  # `predicate_grounding` config block. Unlike `grounding:` (seam 6, gated on the
  # corpus's instance graph `data_path`), this is gated on the corpus's TBox
  # (`shared_ontology`) — every corpus has one, so both CK25 and QALD-9-plus
  # get a `-predicate-grounded` config (Pitfall 5). `k` is per-corpus: CK25's
  # 30 properties sit under PREDICATE_DUMP_THRESHOLD=40 (dump mode; k=40 is
  # a headroom bound, not a retrieval cap), QALD-9-plus's 250 properties
  # exceed it (genuine retrieve mode; k=20 mirrors seam 6's QALD-shaped k).
  # scripted-*-predicate-grounded configs are PLUMBING gates only (config ->
  # build_predicate_index -> seam 7 -> prompt -> judge does not crash) — NOT
  # accuracy evidence (mirrors the seam-6 scripted-ck25-grounded precedent).
  # Do NOT add/modify `openai-gpt4o-mini-qald9plus` above — it already
  # exists as the zero-shot live config (Pitfall 4).
  # --------------------------------------------------------------------

  # CK25 predicate-grounded — no network, deterministic; plumbing gate.
  scripted-ck25-predicate-grounded:
    provider:
      type: scripted
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    predicate_grounding:
      k: 40

  # Live CK25 predicate-grounded sweep — same discipline as
  # openai-gpt4o-mini-ck25-grounded above. Not run in CI — gated behind
  # RUN_EVAL=1 + NL2SPARQL_API_KEY, human-run (Plan 05).
  openai-gpt4o-mini-ck25-predicate-grounded:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    predicate_grounding:
      k: 40

  # --------------------------------------------------------------------
  # Phase 07.4 Plan 05 checkpoint ADDITIVE arm: entity grounding (seam 6)
  # AND predicate grounding (seam 7) composed in ONE config. The live sweep
  # showed predicate-grounding ALONE (openai-gpt4o-mini-ck25-predicate-grounded)
  # regressed vs entity-grounding ALONE (openai-gpt4o-mini-ck25-grounded, 12/49):
  # predicate-only dropped the confirmed entity-grounding lever. This arm tests
  # the real NL-ACC-02 hypothesis — does seam-7 predicate grounding ADD lift ON
  # TOP OF the entity-grounded baseline. The runner already composes both indexes
  # (runner.py passes grounding_index AND predicate_index to NlPipeline); this is
  # a pure config addition, no runner change. `grounding:` mirrors the
  # openai-gpt4o-mini-ck25-grounded arm byte-for-byte; `predicate_grounding:`
  # mirrors the predicate-grounded arm.
  # --------------------------------------------------------------------

  # Additive (entity + predicate) — no network, deterministic; plumbing gate.
  scripted-ck25-grounded-predicate-grounded:
    provider:
      type: scripted
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    grounding:
      k: 20
      label_predicates: ["rdfs:label", "pv:name"]
    predicate_grounding:
      k: 40

  # Live CK25 additive (entity + predicate) sweep — RUN_EVAL=1 + NL2SPARQL_API_KEY,
  # human-run (Plan 05 checkpoint). Confirmatory arm for the additive hypothesis.
  openai-gpt4o-mini-ck25-grounded-predicate-grounded:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    grounding:
      k: 20
      label_predicates: ["rdfs:label", "pv:name"]
    predicate_grounding:
      k: 40

  # QALD-9-plus predicate-grounded — no network, deterministic; plumbing gate.
  scripted-qald9plus-predicate-grounded:
    provider:
      type: scripted
    judge: canonical
    max_repairs: 2
    corpus: vendored/qald9plus/corpus.yml
    predicate_grounding:
      k: 20

  # Live QALD-9-plus predicate-grounded sweep — same discipline as
  # openai-gpt4o-mini-qald9plus above. Not run in CI — gated behind
  # RUN_EVAL=1 + NL2SPARQL_API_KEY, human-run (Plan 05).
  openai-gpt4o-mini-qald9plus-predicate-grounded:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: canonical
    max_repairs: 2
    corpus: vendored/qald9plus/corpus.yml
    predicate_grounding:
      k: 20

  # --------------------------------------------------------------------
  # Phase 07.5 Plan 05 (D-05/REQ-4/REQ-6): additive GENERATED-bank few-shot
  # arms. Unlike the curated fewshot_bank.yml arms below (openai-gpt4o-
  # mini-{dense,bm25}), these point `few_shot:` at the query-first
  # SYNTHETIC (generator-authored) bank via the additive `bank:` sub-key
  # (mirrors the corpus:/data_path: precedent) — absent `bank:` stays
  # today's curated-bank behavior for every existing few_shot arm
  # (byte-identical). scripted-ck25-generated-fewshot is a PLUMBING gate
  # only (config -> BM25 retrieval over the generated bank -> prompt ->
  # judge does not crash) — NOT accuracy evidence; scripted stays the CI
  # default regardless (mirrors the seam-6/seam-7 scripted-*-grounded
  # precedent). k=20 (not the curated arms' k=3) per the Plan 05 spec —
  # the generated CK25 bank has 77 examples across 9 shapes, a wider pool
  # than the curated bank's 23.
  # --------------------------------------------------------------------

  # CK25 generated-fewshot — no network, deterministic; plumbing gate.
  scripted-ck25-generated-fewshot:
    provider:
      type: scripted
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    few_shot:
      mode: bm25
      k: 20
      bank: vendored/ck25/generated_fewshot_bank.yml

  # Live CK25 generated-fewshot sweep — human-run credentialed adopt/kill
  # measurement (Plan 05 Task 3 checkpoint). Not run in CI — gated behind
  # RUN_EVAL=1 + NL2SPARQL_API_KEY.
  openai-gpt4o-mini-ck25-generated-fewshot:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    few_shot:
      mode: bm25
      k: 20
      bank: vendored/ck25/generated_fewshot_bank.yml

  # ===== Composed-lever arms (2026-08 "real evaluation") =====
  # Every lever above was only ever measured IN ISOLATION (entity grounding
  # 14/49, few-shot 11-14/49, predicate grounding 7/49). These arms measure
  # the COMPOSITION — runner.py passes few_shot_index + grounding_index +
  # predicate_index into ONE NlPipeline, so a config carrying multiple seam
  # blocks activates them all. scripted-* twins are no-network plumbing gates
  # (same discipline as the isolated arms); the openai-* arms are human-run,
  # RUN_EVAL=1 + NL2SPARQL_API_KEY, never CI.

  scripted-ck25-grounded-generated-fewshot:
    provider:
      type: scripted
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    grounding:
      k: 20
      label_predicates:
        - rdfs:label
        - pv:name
    few_shot:
      mode: bm25
      k: 20
      bank: vendored/ck25/generated_fewshot_bank.yml

  # Entity grounding (seam 6) + query-first few-shot bank — the two CONFIRMED
  # levers composed. THE composed-ceiling arm.
  openai-gpt4o-mini-ck25-grounded-generated-fewshot:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    grounding:
      k: 20
      label_predicates:
        - rdfs:label
        - pv:name
    few_shot:
      mode: bm25
      k: 20
      bank: vendored/ck25/generated_fewshot_bank.yml

  # Entity grounding + ENRICHED few-shot bank (generated 73 + 11 hand-authored,
  # execution-verified analytic-shape exemplars: superlative-over-category,
  # grouped-superlative, negation, count-with-filter, nested-subquery). The
  # generated bank had only ~1 top_n and ~1 negation exemplar; bucket 1 (the
  # never-pass analytic failures) needs many more. Offline shape-retrieval
  # coverage on the 19 analytic bucket-1 questions rose 8/19 -> 15/19 with this
  # bank. The `g+f-analytic vs g+f` contrast isolates the added exemplars'
  # effect (identical grounding + bm25 mode; only the bank content differs).
  # See docs/ck25-failure-atlas.md.
  scripted-ck25-grounded-analytic-fewshot:
    provider:
      type: scripted
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    grounding:
      k: 20
      label_predicates:
        - rdfs:label
        - pv:name
    few_shot:
      mode: bm25
      k: 20
      bank: vendored/ck25/analytic_fewshot_bank.yml

  openai-gpt4o-mini-ck25-grounded-analytic-fewshot:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    grounding:
      k: 20
      label_predicates:
        - rdfs:label
        - pv:name
    few_shot:
      mode: bm25
      k: 20
      bank: vendored/ck25/analytic_fewshot_bank.yml

  # --- gpt-5-mini CK25 sweep arms (run_composed_sweep.py --model gpt-5-mini) ---
  # Motivated by gpt5_mini_diagnostic.py: gpt-5-mini solved 4/6 genuine-composition
  # bucket-1 cases gpt-4o-mini fails, with ZERO extraction failures. These give it a
  # same-session zero + g+f baseline to pair the analytic arm against. execution judge.
  openai-gpt5-mini-ck25:
    provider:
      type: openai
      model: gpt-5-mini
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml

  openai-gpt5-mini-ck25-grounded-generated-fewshot:
    provider:
      type: openai
      model: gpt-5-mini
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    grounding:
      k: 20
      label_predicates:
        - rdfs:label
        - pv:name
    few_shot:
      mode: bm25
      k: 20
      bank: vendored/ck25/generated_fewshot_bank.yml

  # gpt-5-mini on the SAME enriched analytic bank + grounding — the model-swap
  # experiment. The 07-04 3-model sweep had gpt-5-mini UNDER gpt-4o-mini
  # (bm25 0.44 vs 0.568), possibly a reasoning-model output-extraction artifact
  # (thinking preamble not stripped) rather than a capability gap.
  # gpt5_mini_diagnostic.py inspects raw-vs-extracted output on a few bucket-1
  # analytic cases to tell which. Human-run (RUN_EVAL=1 + NL2SPARQL_API_KEY).
  openai-gpt5-mini-ck25-grounded-analytic-fewshot:
    provider:
      type: openai
      model: gpt-5-mini
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    grounding:
      k: 20
      label_predicates:
        - rdfs:label
        - pv:name
    few_shot:
      mode: bm25
      k: 20
      bank: vendored/ck25/analytic_fewshot_bank.yml

  # Same enriched bank + SHAPE-AWARE retrieval (opt-in `few_shot.shape_aware`):
  # guarantees a query-shape-appropriate exemplar for analytic questions. BM25
  # alone ranks by wording, so "heaviest coil" retrieves lexical "coil" lookups
  # over a superlative exemplar; this forces >=1 same-shape exemplar for
  # analytic questions while leaving non-analytic ones unchanged. Offline
  # shape-retrieval coverage 15/19 -> 17/19 vs the plain analytic arm. The
  # `g+f-analytic-aware vs g+f-analytic` contrast isolates the retrieval change
  # (identical bank + grounding). See docs/ck25-failure-atlas.md.
  scripted-ck25-grounded-analytic-fewshot-aware:
    provider:
      type: scripted
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    grounding:
      k: 20
      label_predicates:
        - rdfs:label
        - pv:name
    few_shot:
      mode: bm25
      k: 20
      bank: vendored/ck25/analytic_fewshot_bank.yml
      shape_aware: true

  openai-gpt4o-mini-ck25-grounded-analytic-fewshot-aware:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    grounding:
      k: 20
      label_predicates:
        - rdfs:label
        - pv:name
    few_shot:
      mode: bm25
      k: 20
      bank: vendored/ck25/analytic_fewshot_bank.yml
      shape_aware: true

  scripted-ck25-all-levers:
    provider:
      type: scripted
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    grounding:
      k: 20
      label_predicates:
        - rdfs:label
        - pv:name
    predicate_grounding:
      k: 40
    few_shot:
      mode: bm25
      k: 20
      bank: vendored/ck25/generated_fewshot_bank.yml

  # Everything: entity grounding + predicate grounding + few-shot bank. Tests
  # whether predicate grounding's documented distraction (07.4, net-negative
  # alone) re-emerges or is absorbed when few-shot examples are also present.
  openai-gpt4o-mini-ck25-all-levers:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    grounding:
      k: 20
      label_predicates:
        - rdfs:label
        - pv:name
    predicate_grounding:
      k: 40
    few_shot:
      mode: bm25
      k: 20
      bank: vendored/ck25/generated_fewshot_bank.yml

  # Entity grounding (seam 6) + query-first few-shot bank + relationship-path
  # grounding (seam 8, Phase 07.6) — proves all three seams stack into ONE
  # NlPipeline (R3). path_grounding.k mirrors R1's <=5 global-pool budget as
  # the config's own knob.
  scripted-ck25-grounded-generated-fewshot-path:
    provider:
      type: scripted
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    grounding:
      k: 20
      label_predicates:
        - rdfs:label
        - pv:name
    few_shot:
      mode: bm25
      k: 20
      bank: vendored/ck25/generated_fewshot_bank.yml
    path_grounding:
      k: 5

  openai-gpt4o-mini-ck25-grounded-generated-fewshot-path:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: execution
    max_repairs: 2
    corpus: vendored/ck25/corpus.yml
    grounding:
      k: 20
      label_predicates:
        - rdfs:label
        - pv:name
    few_shot:
      mode: bm25
      k: 20
      bank: vendored/ck25/generated_fewshot_bank.yml
    path_grounding:
      k: 5

  # Live QALD-9-plus generated-fewshot sweep — non-regression arm (Plan 05
  # Task 3 step 2). QALD's generated bank is empty (0 examples, Plan 04
  # honest TBox-only finding), so BM25 retrieval trivially returns nothing
  # and this arm is EXPECTED to reproduce the flat
  # `openai-gpt4o-mini-qald9plus` zero-shot number exactly — a PASS per
  # RESEARCH OQ-4, not a failure.
  openai-gpt4o-mini-qald9plus-generated-fewshot:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: canonical
    max_repairs: 2
    corpus: vendored/qald9plus/corpus.yml
    few_shot:
      mode: bm25
      k: 20
      bank: vendored/qald9plus/generated_fewshot_bank.yml

  # gpt-4o-mini — the anchor model (06.2's committed live baseline).
  openai-gpt4o-mini-dense:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: canonical
    max_repairs: 2
    few_shot:
      mode: dense
      k: 3

  openai-gpt4o-mini-bm25:
    provider:
      type: openai
      model: gpt-4o-mini
    judge: canonical
    max_repairs: 2
    few_shot:
      mode: bm25
      k: 3

  # gpt-5-mini — mid capability tier (exploratory per D-08/m1).
  openai-gpt5-mini:
    provider:
      type: openai
      model: gpt-5-mini
    judge: canonical
    max_repairs: 2

  openai-gpt5-mini-dense:
    provider:
      type: openai
      model: gpt-5-mini
    judge: canonical
    max_repairs: 2
    few_shot:
      mode: dense
      k: 3

  openai-gpt5-mini-bm25:
    provider:
      type: openai
      model: gpt-5-mini
    judge: canonical
    max_repairs: 2
    few_shot:
      mode: bm25
      k: 3

  # gpt-5 — flagship / deliberate ceiling-effect stress test (exploratory).
  openai-gpt5:
    provider:
      type: openai
      model: gpt-5
    judge: canonical
    max_repairs: 2

  openai-gpt5-dense:
    provider:
      type: openai
      model: gpt-5
    judge: canonical
    max_repairs: 2
    few_shot:
      mode: dense
      k: 3

  openai-gpt5-bm25:
    provider:
      type: openai
      model: gpt-5
    judge: canonical
    max_repairs: 2
    few_shot:
      mode: bm25
      k: 3
