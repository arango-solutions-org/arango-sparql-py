# Golden corpus for BIND (rdflib's ``Extend`` algebra node).
#
# Contract per legacy ``aql-query-builder.js#let``:
#   BIND(<expr> AS ?v)  →  LET <fresh_alias> = <expr>
# and ``?v`` becomes resolvable to ``<fresh_alias>`` in every subsequent
# clause (FILTER, SORT, projection RETURN). The alias is freshly minted
# with a ``bv`` prefix to avoid colliding with FOR aliases (``doc1``…)
# or AQL reserved words that would otherwise clash with the user's
# SPARQL variable name.

ontology: |
  @prefix : <http://ex.org/> .
  @prefix owl: <http://www.w3.org/2002/07/owl#> .
  @prefix phys: <https://arango.solutions/phys#> .

  :Person a owl:Class ; phys:collectionName "Person" .

cases:
  - name: bind_ucase_in_projection
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?n ?upper WHERE {
        ?s a :Person ; :name ?n .
        BIND(UCASE(?n) AS ?upper)
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      LET bv2 = UPPER(doc1.name)
      RETURN { n: doc1.name, upper: bv2 }
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: bind_arithmetic_then_filter
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?n ?dbl WHERE {
        ?s a :Person ; :name ?n ; :age ?a .
        BIND(?a * 2 AS ?dbl)
        FILTER (?dbl >= 60)
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "age")
      FILTER HAS(doc1, "name")
      LET bv4 = (FOR num2 IN [doc1.age] FOR num3 IN [@_p1] RETURN IS_NUMBER(num2) && IS_NUMBER(num3) ? (num2 * num3) : null)[0]
      FILTER (bv4 >= @_p2)
      RETURN { n: doc1.name, dbl: bv4 }
    expected_bind_vars:
      "@c1_Person": "Person"
      "_p1": 2
      "_p2": 60

  - name: bind_then_order_by_alias
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?upper WHERE {
        ?s a :Person ; :name ?n .
        BIND(UCASE(?n) AS ?upper)
      } ORDER BY ?upper
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      LET bv2 = UPPER(doc1.name)
      SORT bv2 ASC
      RETURN { upper: bv2 }
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: bind_strlen
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?n ?len WHERE {
        ?s a :Person ; :name ?n .
        BIND(STRLEN(?n) AS ?len)
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      LET bv2 = LENGTH(doc1.name)
      RETURN { n: doc1.name, len: bv2 }
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: bind_chained
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?lower ?upper WHERE {
        ?s a :Person ; :name ?n .
        BIND(LCASE(?n) AS ?lower)
        BIND(UCASE(?lower) AS ?upper)
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      LET bv2 = LOWER(doc1.name)
      LET bv3 = UPPER(bv2)
      RETURN { lower: bv2, upper: bv3 }
    expected_bind_vars:
      "@c1_Person": "Person"

  # ---- BIND with an unbound right-hand side (SPARQL §17.2.1) --------
  #
  # SPARQL §17.4.1.2 + §17.2.1: when ``BIND(expr AS ?v)`` evaluates
    # ``expr`` and a referenced variable is unbound, the expression
    # evaluates to the spec's "error" value; the row is KEPT, and
  # ``?v`` is simply left unbound on this row. The visitor lowers
  # this to ``LET <bv> = null`` so the row continues, ``?v`` carries
  # ``null`` (our model's representation of "unbound"), and every
  # downstream FILTER / projection treats it per the null-propagation
  # rules SPARQL §17.2.1 prescribes (FILTER(null) → row excluded;
  # COALESCE(null, x) → x; arithmetic with null → null; etc.).
  #
  # Translation also emits a ``W_UNBOUND_VARIABLE_IN_EXPR`` warning
  # so an operator can disambiguate a deliberate use from a typo
  # (``?nove`` vs ``?nova``) without the silent semantics of bare
  # ``null``. The warning is pinned by a separate Python test —
  # the YAML golden only locks the AQL byte-shape.

  - name: bind_unbound_rhs_emits_null
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?z WHERE {
        ?s a :Person ; :name ?n .
        BIND(?nova AS ?z)
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      LET bv2 = null
      RETURN { z: bv2 }
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: projection_coalesce_unbound_var_skipped
    # ``SELECT (COALESCE(?z, -3) AS ?d)`` — ``?z`` never bound by
    # the pattern. AQL's ``COALESCE(null, x)`` returns ``x``, which
    # is exactly what SPARQL §17.4.1.3 prescribes: COALESCE skips
    # the error-evaluating arg and returns the next. So the
    # projection ``?d`` cleanly carries ``-3`` for every row.
    # Mirrors the W3C ``functions/coalesce01`` shape (which uses
    # multiple COALESCE arms in one SELECT).
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?n (COALESCE(?z, -3) AS ?d) WHERE {
        ?s a :Person ; :name ?n
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      LET bv3 = NOT_NULL(null, (FOR num2 IN [@_p1] RETURN IS_NUMBER(num2) ? (0 - num2) : null)[0])
      RETURN { n: doc1.name, d: bv3 }
    expected_bind_vars:
      "@c1_Person": "Person"
      "_p1": 3

  - name: projection_datatype_unbound_propagates_null
    # ``SELECT (DATATYPE(?m) AS ?dt)`` — ``?m`` never bound. The
    # expression needs an unbound variable's value, so it is an error in
    # every row and is emitted as ``null`` as a whole
    # (``expression_errors.certainly_error``, #125) → ``?dt`` is left
    # unbound on every row. Mirrors the W3C ``project-expression/projexp06``
    # shape.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?n (DATATYPE(?m) AS ?dt) WHERE {
        ?s a :Person ; :name ?n
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      LET bv2 = null
      RETURN { n: doc1.name, dt: bv2 }
    expected_bind_vars:
      "@c1_Person": "Person"
