# Golden corpus for FILTER translation.
#
# These cases lock in the AQL the visitor emits for SPARQL FILTER
# expressions today. Each case is independent. Update by hand only.

ontology: |
  @prefix : <http://ex.org/> .
  @prefix owl: <http://www.w3.org/2002/07/owl#> .
  @prefix phys: <https://arango.solutions/phys#> .

  :Person a owl:Class ; phys:collectionName "Person" .

cases:
  - name: equality_var_to_string_literal
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person ; :name ?n . FILTER(?n = "Alice") }
    expected_aql: |
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      FILTER (doc1.name == @_p1)
      RETURN { s: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Person": "Person"
      "_p1": "Alice"

  - name: range_filter_numeric
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person ; :age ?a . FILTER(?a > 18 && ?a < 65) }
    expected_aql: |
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "age")
      FILTER ((doc1.age > @_p1) && (doc1.age < @_p2))
      RETURN { s: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Person": "Person"
      "_p1": 18
      "_p2": 65

  - name: regex_with_case_insensitive_flag
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person ; :name ?n . FILTER(REGEX(?n, "^a", "i")) }
    expected_aql: |
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      FILTER REGEX_TEST(doc1.name, @_p1, true)
      RETURN { s: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Person": "Person"
      "_p1": "^a"

  - name: bound_check
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person ; :name ?n . FILTER(BOUND(?n)) }
    expected_aql: |
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      FILTER (doc1.name != null)
      RETURN { s: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: not_bound
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person ; :name ?n . FILTER(!BOUND(?n)) }
    expected_aql: |
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      FILTER !((doc1.name != null))
      RETURN { s: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: str_then_equality
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person ; :name ?n . FILTER(STR(?n) = "Alice") }
    expected_aql: |
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      FILTER (TO_STRING(doc1.name) == @_p1)
      RETURN { s: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Person": "Person"
      "_p1": "Alice"

  - name: contains
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person ; :name ?n . FILTER(CONTAINS(?n, "li")) }
    expected_aql: |
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      FILTER CONTAINS(doc1.name, @_p1)
      RETURN { s: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Person": "Person"
      "_p1": "li"

  - name: or_and_combination
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person ; :name ?n . FILTER((?n = "Alice" || ?n = "Bob") && BOUND(?n)) }
    expected_aql: |
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      FILTER (((doc1.name == @_p1) || (doc1.name == @_p2)) && (doc1.name != null))
      RETURN { s: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Person": "Person"
      "_p1": "Alice"
      "_p2": "Bob"

  - name: arithmetic_in_filter
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person ; :age ?a . FILTER(?a + 1 > 21) }
    expected_aql: |
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "age")
      FILTER ((FOR num2 IN [doc1.age] FOR num3 IN [@_p1] RETURN IS_NUMBER(num2) && IS_NUMBER(num3) ? (num2 + num3) : null)[0] > @_p2)
      RETURN { s: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Person": "Person"
      "_p1": 1
      "_p2": 21

  - name: not_equals
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person ; :name ?n . FILTER(?n != "Alice") }
    expected_aql: |
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      FILTER (doc1.name != @_p1)
      RETURN { s: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Person": "Person"
      "_p1": "Alice"

  # ---- FILTER with an unbound variable (SPARQL §17.2.1) ------------
  #
  # SPARQL §17.2.1: a variable referenced in a FILTER expression but
  # never bound by the surrounding pattern evaluates to an "error"
  # value, which causes the FILTER to fail and the row to be
  # excluded (§18.5). AQL's null does not propagate so (``null == X``
  # is a boolean, ``null != X`` true), so an expression that needs an
  # unbound variable's value is emitted as ``null`` as a whole
  # (``expression_errors.certainly_error``, #125), and ``FILTER null``
  # excludes the row. The literal is then never bound.
  #
  # A ``W_UNBOUND_VARIABLE_IN_EXPR`` warning is also emitted on the
  # builder so a SPARQL typo (``?nove`` vs ``?nova``) doesn't go
  # unnoticed; the YAML golden pins only the AQL byte-shape.

  - name: filter_unbound_variable_emits_null
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE {
        ?s a :Person ; :name ?n .
        FILTER(?z = 3)
      }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      FILTER null
      RETURN { s: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Person": "Person"

  - name: starts_with
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person ; :name ?n . FILTER(STRSTARTS(?n, "Al")) }
    expected_aql: |
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "name")
      FILTER STARTS_WITH(doc1.name, @_p1)
      RETURN { s: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Person": "Person"
      "_p1": "Al"

  # ---- IN / NOT IN (SPARQL §17.4.1.9) -------------------------------

  - name: in_nonempty_list
    # ``?a IN (18, 21)`` — the membership operator over a non-empty
    # list. rdflib hands the candidate set as a Python list, which
    # maps directly to an inline AQL ``[…]`` of bind variables.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person ; :age ?a . FILTER(?a IN (18, 21)) }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "age")
      FILTER (doc1.age IN [@_p1, @_p2])
      RETURN { s: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Person": "Person"
      "_p1": 18
      "_p2": 21

  - name: not_in_empty_list
    # ``?a NOT IN ()`` — the EMPTY-set case. rdflib represents the
    # empty candidate list as the ``rdf:nil`` URIRef (NOT ``[]``);
    # since ``URIRef`` is a ``str`` subclass, the visitor must
    # special-case it or it would iterate the IRI's characters and
    # crash. Normalised to an empty AQL list, so ``NOT IN []`` is
    # always true (and ``IN []`` always false) — SPARQL §17.4.1.9's
    # empty-set contract. Regression for W3C ``functions/notin01``.
    sparql: |
      PREFIX : <http://ex.org/>
      SELECT ?s WHERE { ?s a :Person ; :age ?a . FILTER(?a NOT IN ()) }
    expected_aql: |-
      FOR doc1 IN @@c1_Person
      FILTER HAS(doc1, "age")
      FILTER (doc1.age NOT IN [])
      RETURN { s: NOT_NULL(doc1._uri, doc1._id) }
    expected_bind_vars:
      "@c1_Person": "Person"
