[project]
name = "arango-sparql-py"
version = "0.5.0"
description = "Python-native SPARQL 1.1 to AQL transpiler for ArangoDB."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "python-arango>=8.1.1",
  "rdflib>=7.0",
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.20.0",
  "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/arango-solutions/arango-sparql-py"
Repository = "https://github.com/arango-solutions/arango-sparql-py"
Issues = "https://github.com/arango-solutions/arango-sparql-py/issues"

[tool.hatch.metadata]
# No dependency is a direct reference today: the nl and dense extras take
# arango-query-core from PyPI (ece1646 dropped the git pin). Hatchling needs
# this flag for direct references, so it lets a deliberate git pin (CC-9) go
# back in without a build change.
allow-direct-references = true

[project.optional-dependencies]
analyzer = [
  # Mirror arango-cypher-py: pin the schema analyzer band so
  # service installs fail fast on heuristic mappings. 0.9.0 floor: adds
  # named-graph membership (metadata.graphMembership + per-entry graphs),
  # graphScope, CSI v1, GraphRAG detection, and gold/metric-history.
  # The ``[anthropic,openai]`` extras pull both client SDKs so an operator CAN
  # opt the analyzer into LLM-backed classification with
  # SCHEMA_ANALYZER_PROVIDER (arango_sparql/schema/acquire.py::
  # _resolve_analyzer_provider). By default the analyzer runs WITHOUT an LLM
  # (deterministic baseline), matching arango-cypher-py: on a large database
  # its scan exhausts the total budget and the LLM call never succeeds
  # (PRD §6.3.2). The baseline can misclassify LABEL-style / hybrid
  # collections, which is the trade-off the opt-in exists for.
  # Band admits the analyzer's current minor and the previous one: 0.12 carries
  # the extended tool contract (entityStrategy, detectForeignKeys) that consumers
  # like the CDF reverse-CSI export require — a <0.10 ceiling silently DOWNGRADED
  # a co-installed 0.12 and broke them (observed: CDF `make seed`, 2026-09-06);
  # 0.13 adds the bitemporal provenance (§3.13.5) the same export forwards; 0.14
  # converges LPG type detection on the analyzer (tier-1 acceptance, added
  # candidates, `_fromType`/`_toType` endpoints) so LABEL / GENERIC_WITH_TYPE
  # entries arrive already decided (fast suite green on 0.14.0). Raised together
  # with arango-cypher-py's band on 2026-09-14 (0.13) and 2026-09-15 (0.14) under
  # the PRD §12.1 invariant. Floor 0.14.1 (2026-10-13, matching arango-cypher-py's
  # 2026-10-05 raise): 0.14.1 stops reading an edge field that copies the endpoint
  # collection names as the relationship type — on prod.demo IAM, which this
  # service queries, that renamed CAN_ACCESS / CAN_ASSUME / … after their target
  # collections. Ceiling <0.16.0 (2026-10-14, raised together with
  # arango-cypher-py): 0.15 groups an array-valued LPG type field by its primary
  # label, so r2g's `labels: [...]` nodes become LABEL entities (with #10's
  # array-aware type test, PRD §6.1) instead of one `Node` entity. Ceiling
  # <0.18.0 (2026-10-26, raised together with arango-cypher-py): 0.16 and 0.17
  # change only the singularizer (CSI class names for `-se`, `-ie`, `-ves`,
  # classical and irregular plurals and `-s` singulars: `warehouses` ->
  # `Warehouse`, was `Warehous`); no API this package calls changed, and the
  # fast suite is green on 0.17.0. The floor stays 0.14.1, so an install may
  # name such a class either way until it is raised.
  # tests/test_analyzer_band_parity.py enforces the shared ceiling.
  "arangodb-schema-analyzer[anthropic,openai]>=0.14.1,<0.18.0",
]
service = [
  "arango-sparql-py[analyzer]",
  "typer>=0.9.0",
  "rich>=13.0.0",
  "python-dotenv>=1.0.0",
  # Platform (BYOC) sessions: the Workbench opens a session as the signed-in
  # platform user from the gateway-forwarded JWT (arango_sparql/service/
  # platform_auth.py). PyJWT narrows python-arango's local token decode;
  # requests runs the post-failure endpoint probe. Both are pulled in
  # transitively by python-arango, but platform_auth imports them directly, so
  # they are declared here (matches arango-cypher-py's service deps).
  "PyJWT>=2.0",
  "requests>=2.28",
]
cli = [
  "typer>=0.9.0",
  "rich>=13.0.0",
]
nl = [
  "openai>=1.0.0",
  "anthropic>=0.20.0",
  "rank_bm25>=0.2.2",
  "PyYAML>=6.0.0",
  # Shared NL engine + adapter seams + conceptual-model substrate
  # (NLQueryEngine, seam protocols, DenseRetriever) driving BOTH the nl2sparql
  # pipeline and the shared-engine _core/adapter (nl-engine-extraction, PRD
  # §12.3). Now consumed as a PUBLISHED PyPI release (compat range, matching this
  # repo's convention for its other published dep, arangodb-schema-analyzer)
  # instead of a git pin — a direct git URL here would make arango-sparql-py
  # itself unpublishable (PyPI rejects direct URLs in Requires-Dist; see
  # RELEASE.md). 0.2.0 is the first release carrying the caller-supplied
  # POSTCONDITION mechanism (arango_query_core.nl.{Postcondition,
  # PostconditionViolation,PostconditionContext,run_postconditions,
  # postcondition_prompt_sections}) — a superset of the former f2f3061 git pin,
  # verified on PyPI to ship nl/postconditions.py + the [nl]/[dense] extras.
  # 0.2.3 added PostconditionViolation.soft (PRD §7.3.1); on 0.2.0-0.2.2 a soft
  # check silently fails closed, so 0.2.3 is the floor.
  # Bump the lower bound deliberately (CC-9: consumers re-run goldens); the
  # <0.3.0 ceiling holds the semver-minor compatibility band.
  "arango-query-core>=0.2.3,<0.3.0",
]
# Torch-free-by-default packaging (D-05 packaging discretion, Phase 7 07-03):
# a plain `pip install '.[nl]'` never pulls sentence-transformers/torch — the
# production `SparqlAdapter.few_shot_index()` seam defaults to `mode="auto"`
# and gracefully degrades to BM25/no-op without it. Installing `.[dense]` is
# the ONLY path that pulls torch, composing arango-query-core's own `[dense]`
# extra (sentence-transformers) on top of `[nl]`'s deps.
dense = [
  "arango-sparql-py[nl]",
  "arango-query-core[dense]>=0.2.3,<0.3.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff==0.15.22",
  "mypy>=1.11",
  "httpx>=0.24.0",
  "PyYAML>=6.0.0",
  # pyoxigraph is the W3C-compliant reference triplestore for
  # cross-validation tests (analog of Neo4j in arango-cypher-py).
  "pyoxigraph>=0.3.22",
  "arango-sparql-py[analyzer]",
  "typer>=0.9.0",
  # SPARQLWrapper is the exact client PRD §11.1 names as the automated
  # third-party-tool compat target (D-06).
  "SPARQLWrapper>=2.0.0",
]

[project.scripts]
arango-sparql-py = "arango_sparql.cli:app"

# BYOC deployment settings for the shared arango-byoc-deploy tool
# (docs/BYOC_DEPLOYMENT.md, PRD §15.8). Run:
#   uv run --group deploy arango-byoc-deploy <command>
[tool.arango-byoc]
app-name     = "arango-sparql-py"
instance     = "arango-sparql-py"
display-name = "Arango SPARQL"
description  = "SPARQL 1.1 → AQL translation service + workbench for ArangoDB."
base-image   = "py12base"
tarball      = "arango-sparql-py.tar.gz"   # scripts/package_arango_manual.sh
# The release is [project].version (tests/test_version_parity.py keeps
# arango_sparql.__version__ equal to it); /openapi.json reports it.
version-probe    = { path = "/openapi.json", json-key = "info.version" }
required-members = ["entrypoint", "pyproject.toml", "arango_sparql/__init__.py", "ui/dist/index.html"]
index-html       = "ui/dist/index.html"   # --no-ui deploys the bare API
# The one *_API_KEY the sanitized bake may carry (NL→SPARQL needs it); the
# packager allowlist already excludes PYPI_*/RUN_*. Without this the preflight
# refuses a bundle that bakes OPENAI_API_KEY. ARANGO_PASSWORD is not an
# *_API_KEY, so the preflight never flags it.
allow-baked-secrets = ["OPENAI_API_KEY", "ANTHROPIC_API_KEY", "OPENROUTER_API_KEY"]
# The mount prefix is baked into the bundle (SERVICE_ROOT_PATH ->
# scripts/package_arango_manual.sh -> ROOT_PATH in .env); name the env var the
# deploy tool checks for it. The platform drops app env, so this is baked, not
# passed at deploy time.
prefix-env-var = "ROOT_PATH"
# Poll /health for readiness (exists with or without the bundled UI) before the
# probes run — a bare --no-ui deploy has no "/" route.
ready-path     = "/health"
# These are EXTRA checks run unconditionally, on top of the tool's built-in
# root-page + asset verification (which it already does, gated on has-ui — it
# polls the mount root and loads every asset for a UI deploy, and skips that for
# --no-ui). So do NOT list "/" here: a bare "/" probe runs even under --no-ui,
# where the service has no root route, and would 404 a healthy bare API. Both
# below answer with or without the UI.
probes = [
  { path = "/health", label = "health", expect-json-key = "status" },
  { path = "/openapi.json", label = "API" },
]

# Deploy tooling, kept out of the published package's metadata (a dependency
# group is never part of the wheel), so the git pin cannot affect a PyPI
# release. Pinned to an exact commit until arango-byoc-deploy is on PyPI.
[dependency-groups]
deploy = ["arango-byoc-deploy"]

[tool.uv.sources]
arango-byoc-deploy = { git = "https://github.com/ArthurKeen/arango-byoc-deploy", rev = "0aa88d9c2cb6641f9bdff50c46e3ad9f057c76d4" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires a running ArangoDB (see README); use docker-compose.yml",
  "w3c: SPARQL 1.1 W3C DAWG evaluation harness",
  "cross: cross-validates transpiled AQL bindings against pyoxigraph as the W3C reference store",
  "eval: NL->SPARQL evaluation harness; slow, gated behind RUN_EVAL=1",
  "schema_live: schema detection against seeded live PG/LPG/RPT/hybrid databases (PRD §13.1); also marked integration, so gated on RUN_INTEGRATION=1",
  "perf: performance budget enforcement (see PRD §9.4); CI-blocking on >25% p95 regression for the fast in-process rows",
  "ldbc: LDBC SNB harness (PRD §13.6); live tests also need RUN_INTEGRATION=1 and RUN_LDBC=1",
]

# Static typing starts where the correctness risk is highest — the
# translate package (parser → visitor → builder → resolver). Widen the
# `files` list as other packages are annotated; do not turn on
# `strict` until visitor.py's algebra boundary has real types.
[tool.mypy]
files = ["arango_sparql/translate", "arango_sparql/editor", "arango_sparql/schema/vocabulary.py"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "F401", "F841"]
"scripts/**/*.py" = ["E402"]
"arango_sparql/service/__init__.py" = ["F401", "E402", "I001"]

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arango_sparql"]
